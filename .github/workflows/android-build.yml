name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older build that is still running.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Phones can't upload folders to GitHub, so the project may arrive as one
      # .zip file at the repository root. If so, unpack it here before building.
      # If the project files are already in the repository, this step does nothing.
      - name: Unpack project zip (if uploaded from a phone)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            echo "Project files found at the repository root - nothing to unpack."
            exit 0
          fi
          zip_file="$(find . -maxdepth 1 -type f -iname 'RayeanAIKeyboard*.zip' | head -n 1)"
          if [ -z "$zip_file" ]; then
            zip_file="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          fi
          if [ -z "$zip_file" ]; then
            echo "::error::No gradlew and no project .zip found at the repository root. Upload RayeanAIKeyboard.zip to the root of the repository."
            exit 1
          fi
          echo "Unpacking $zip_file"
          unpack_dir="$RUNNER_TEMP/project"
          rm -rf "$unpack_dir"
          mkdir -p "$unpack_dir"
          unzip -q "$zip_file" -d "$unpack_dir"
          wrapper="$(find "$unpack_dir" -maxdepth 3 -type f -name gradlew | head -n 1)"
          if [ -z "$wrapper" ]; then
            echo "::error::$zip_file does not contain the Android project (gradlew not found)."
            exit 1
          fi
          cp -a "$(dirname "$wrapper")/." .
          echo "Unpacked project:"
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayeanAIKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
